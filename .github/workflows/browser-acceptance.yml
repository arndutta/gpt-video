name: Chromium acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-acceptance

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
      LANGFUSE_ENABLED: 'false'
      LIVE_COMPETITOR_ENABLED: 'false'
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.5'
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - name: Create the Python environment
        run: python -m venv .venv
      - name: Install locked Python dependencies
        run: .venv/bin/python -m pip install -r requirements.lock
      - name: Install locked frontend dependencies
        run: npm --prefix web ci
      - name: Prepare real local embeddings
        run: .venv/bin/python -m scripts.rag prepare
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify production UI in Chromium
        run: npm --prefix web run test:browser
      - name: Retain screenshots, traces and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/browser-qa/
          if-no-files-found: warn
          retention-days: 7
