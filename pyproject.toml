[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-pricing-workbench"
version = "0.1.0"
description = "Local retail pricing services and deterministic quantitative preview"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "structlog>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["commerce*", "platform_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
